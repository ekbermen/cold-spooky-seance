          // 3. Bazar
          AZ.reg({id:'bazar',name:'Bazar',cat:'sim',icon:'🏪',k:.1,start(root,api){
           let m=0,tot=0,pw=1,au=0,t=45;const info=AZ.info(root,''),bt=h('button','big','🍇'),u1=h('button','btn',''),u2=h('button','btn alt','');
           root.append(bt,u1,u2);
           const c1=()=>8*pw*pw,c2=()=>12*(au+1)*(au+1);
           const upd=()=>{info.textContent=`⏱ ${t} · 🪙 ${m} · Cəmi ${tot}`;u1.textContent=`Böyük səbət (+1 toxunuş) — ${c1()}`;u2.textContent=`Köməkçi (+1/san) — ${c2()}`;api.score(tot)};
           bt.onclick=()=>{m+=pw;tot+=pw;upd();api.beep(500,.02)};
           u1.onclick=()=>{if(m>=c1()){m-=c1();pw++;upd()}};
           u2.onclick=()=>{if(m>=c2()){m-=c2();au++;upd()}};
           api.every(1000,()=>{m+=au;tot+=au;t--;upd();if(t<=0)api.over(tot)});upd()}});
          })();
          AZEOF

      - name: Android proyektini yarat (Capacitor)
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7
          npx cap init AzerPlay az.azerplay.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Ikon yarat
        continue-on-error: true
        run: |
          mkdir -p assets
          convert -size 1024x1024 gradient:'#1e9bd6-#0b1230' -gravity center -fill '#ffc928' -pointsize 480 -font DejaVu-Sans-Bold -annotate 0 'AP' assets/icon-only.png
          npm i -D @capacitor/assets@3
          npx capacitor-assets generate --android --iconBackgroundColor '#0b1230' --iconBackgroundColorDark '#0b1230'

      - name: Ad ve ekran ayarlari
        run: |
          sed -i 's/>AzerPlay</>AzərPlay</g' android/app/src/main/res/values/strings.xml
          sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: APK build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../AzerPlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AzerPlay-apk
          path: AzerPlay.apk

      - name: Release yarat (telefondan yukle)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AzərPlay build ${{ github.run_number }}
          files: AzerPlay.apk
