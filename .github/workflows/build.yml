name: AzərPlay APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Oyun fayllarini yarat
        run: |
          mkdir -p www
          cat > www/index.html <<'AZEOF'
          <!doctype html>
          <html lang="az">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
          <title>AzərPlay</title>
          <link rel="stylesheet" href="style.css">
          </head>
          <body>
          <div id="app"></div>
          <div id="toast"></div>
          <script src="core.js"></script>
          <script src="games/zeka.js"></script>
          <script src="games/arkada.js"></script>
          <script src="games/idman.js"></script>
          <script src="games/macera.js"></script>
          <script src="games/strat.js"></script>
          <script src="games/sim.js"></script>
          <script>AZ.init()</script>
          </body>
          </html>
          AZEOF
          mkdir -p www
          cat > www/style.css <<'AZEOF'
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
          html,body{margin:0;height:100%;background:#0b1230;color:#fff;font-family:system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
          button{font-family:inherit}
          #app{height:100dvh;display:flex;flex-direction:column;position:relative;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
          .top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#101b45;flex-shrink:0}
          .logo{font-size:24px;font-weight:900;color:#4cc3ff;flex:1;letter-spacing:.5px}
          .logo span{color:#ffc928}
          .coins{background:#1d2b63;border-radius:999px;padding:6px 12px;font-weight:800;color:#ffd54a;white-space:nowrap}
          .back{background:#1d2b63;color:#fff;border:0;border-radius:12px;width:38px;height:38px;font-size:26px;line-height:1}
          .ttl{flex:1;font-weight:800;font-size:17px}
          .sc{font-weight:800;color:#4cc3ff;min-width:40px;text-align:right}
          .tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;flex-shrink:0}
          .tab{white-space:nowrap;border:0;border-radius:999px;padding:8px 14px;background:#1a2658;color:#cfe0ff;font-weight:700}
          .tab.on{background:#ffc928;color:#222}
          .grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 12px 16px;align-content:start}
          .card{border:0;border-radius:18px;padding:16px 8px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px}
          .card .ic{font-size:44px}.card .nm{font-weight:800;font-size:15px;text-align:center}.card .bs{font-size:12px;opacity:.85}
          .c-zeka{background:linear-gradient(160deg,#6a3fd1,#3a1f86)}
          .c-arkada{background:linear-gradient(160deg,#e0393a,#8d1417)}
          .c-idman{background:linear-gradient(160deg,#2fae5c,#12643a)}
          .c-macera{background:linear-gradient(160deg,#1e9bd6,#115a8c)}
          .c-strat{background:linear-gradient(160deg,#f0a21b,#a36508)}
          .c-sim{background:linear-gradient(160deg,#e0743a,#8a3a12)}
          .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;touch-action:none;overflow:hidden;min-height:0}
          .stage canvas{border-radius:14px;touch-action:none;max-width:100%}
          .msg{font-size:16px;color:#9fc3ff;text-align:center;min-height:26px;font-weight:600}
          .board{display:grid;gap:4px;touch-action:none}
          .cell{border:0;border-radius:10px;background:#1b2a5c;color:#fff;font-size:clamp(18px,6vw,34px);display:flex;align-items:center;justify-content:center;padding:0;font-weight:800}
          .cell.sel{outline:3px solid #ffc928}
          .cell.ok{background:#1f7a45}
          .t{color:#222}
          .lamp{background:#26305e}.lamp.on{background:#ffd54a;box-shadow:0 0 16px #ffd54a}
          .go{background:#c8963e;font-size:clamp(14px,5vw,26px);border-radius:4px}
          .c4{background:#1d3fa5;border-radius:50%}
          .rv{background:#1e7a46}
          .xo{background:#223273;font-size:clamp(30px,14vw,60px)}
          .num{background:#3a56b8;font-size:clamp(26px,10vw,48px)}
          .quiz{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;padding:6px}
          .q{font-size:20px;font-weight:800;text-align:center;margin-bottom:6px}
          .q.big{font-size:46px}
          .opt{padding:14px;border-radius:14px;border:2px solid #2d4a9c;background:#15235a;color:#fff;font-size:18px;font-weight:700}
          .opt.good{background:#1f7a45;border-color:#1f7a45}
          .opt.bad{background:#a32424;border-color:#a32424}
          .big{font-size:88px;background:#1b2a5c;border:0;border-radius:50%;width:170px;height:170px;color:#fff}
          .btn{display:block;width:100%;max-width:360px;margin-top:10px;padding:14px;border:0;border-radius:14px;background:#ffc928;color:#222;font-weight:800;font-size:17px}
          .btn.alt{background:#2d4a9c;color:#fff}
          .glass{position:relative;width:140px;height:230px;border:4px solid #cfe3ff;border-top:0;border-radius:0 0 44px 44px;background:rgba(255,255,255,.06);margin:14px 0}
          .fill{position:absolute;bottom:0;left:0;right:0;height:0;background:#b5381c;border-radius:0 0 38px 38px}
          .tline{position:absolute;left:-16px;right:-16px;height:4px;background:#ffd54a;border-radius:2px}
          .pour{width:100%;max-width:300px;padding:20px;border:0;border-radius:18px;background:#e0743a;color:#fff;font-size:20px;font-weight:800;touch-action:none}
          .kb{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
          .sk{display:flex;align-items:center;gap:12px;background:#1b2a5c;border:0;border-radius:14px;padding:14px;color:#fff;font-size:30px}
          .bar{flex:1;height:20px;background:#0b1230;border-radius:10px;position:relative;overflow:hidden}
          .bf{position:absolute;left:0;top:0;bottom:0;width:0}
          .pz{position:absolute;left:70%;width:25%;top:0;bottom:0;background:rgba(255,255,255,.3)}
          .ovl{position:absolute;inset:0;background:rgba(5,8,24,.88);display:flex;align-items:center;justify-content:center;z-index:5}
          .box{background:#16235a;border-radius:22px;padding:24px;text-align:center;width:min(86%,320px)}
          .box h2{margin:0 0 8px}.earn{font-size:26px;font-weight:900;color:#ffd54a;margin:6px 0}
          #toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,30px);background:#ffc928;color:#222;font-weight:800;padding:10px 18px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
          #toast.show{opacity:1;transform:translate(-50%,0)}
          AZEOF
          mkdir -p www
          cat > www/core.js <<'AZEOF'
          (function(){
          const AZ=window.AZ={games:[],reg(g){this.games.push(g)}};
          const $=s=>document.querySelector(s);
          const S={coins:0,best:{},day:''};
          try{Object.assign(S,JSON.parse(localStorage.getItem('azp')||'{}'))}catch(e){}
          const save=()=>{try{localStorage.setItem('azp',JSON.stringify(S))}catch(e){}};
          const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;return e};
          Object.assign(AZ,{S,h,
           rnd:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
           pick:a=>a[Math.floor(Math.random()*a.length)],
           shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
           info:(root,t)=>{const e=h('div','msg',t);root.append(e);return e},
           board:(root,c,r=c)=>{const b=h('div','board');b.style.gridTemplateColumns=`repeat(${c},1fr)`;b.style.gridTemplateRows=`repeat(${r},1fr)`;b.style.aspectRatio=c+'/'+r;b.style.width=`min(100%,calc((100dvh - 210px)*${c/r}))`;root.append(b);return b}
          });
          const CATS=[['all','🎮','Hamısı'],['zeka','🧠','Zəka'],['arkada','🕹️','Arkada'],['idman','⚽','İdman'],['macera','🏔️','Macəra'],['strat','♟️','Strategiya'],['sim','🍵','Simulyator']];
          let cat='all',cur=null,cleanups=[],ac,tt;
          const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2500)};
          const upd=()=>document.querySelectorAll('.coins').forEach(e=>e.textContent='🪙 '+S.coins);
          const stop=()=>{cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[]};

          function home(){
            stop();cur=null;
            const app=$('#app');app.innerHTML='';
            const top=h('div','top','<div class="logo">Azər<span>Play</span></div><div class="coins"></div>');
            const tabs=h('div','tabs');
            CATS.forEach(([k,i,n])=>{const b=h('button','tab'+(k===cat?' on':''),i+' '+n);b.onclick=()=>{cat=k;home()};tabs.append(b)});
            const grid=h('div','grid');
            AZ.games.filter(g=>cat==='all'||g.cat===cat).forEach(g=>{
              const c=h('button','card c-'+g.cat,`<div class="ic">${g.icon}</div><div class="nm">${g.name}</div><div class="bs">${S.best[g.id]?'🏆 '+S.best[g.id]:'Yeni'}</div>`);
              c.onclick=()=>play(g);grid.append(c)});
            app.append(top,tabs,grid);upd();
          }

          function play(g){
            stop();cur=g;
            const app=$('#app');app.innerHTML='';
            const top=h('div','top');
            const back=h('button','back','‹');back.onclick=home;
            const sc=h('div','sc','');
            top.append(back,h('div','ttl',g.name),sc,h('div','coins'));
            const root=h('div','stage');app.append(top,root);upd();
            let done=false;
            const api={
              root,
              score(n){sc.textContent=n},
              on(f){cleanups.push(f)},
              raf(fn){let id,l=performance.now(),run=true;const t=n=>{if(!run)return;const dt=Math.min(.05,(n-l)/1000);l=n;fn(dt);if(run)id=requestAnimationFrame(t)};id=requestAnimationFrame(t);cleanups.push(()=>{run=false;cancelAnimationFrame(id)})},
              every(ms,fn){const id=setInterval(fn,ms);cleanups.push(()=>clearInterval(id))},
              after(ms,fn){const id=setTimeout(fn,ms);cleanups.push(()=>clearTimeout(id))},
              cv(w,hh){const c=h('canvas');c.width=w;c.height=hh;c.style.aspectRatio=w+'/'+hh;c.style.width=`min(100%,calc((100dvh - 150px)*${w/hh}))`;root.append(c);
                return{c,x:c.getContext('2d'),w,h:hh,pos:e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*w/r.width,(e.clientY-r.top)*hh/r.height]}}},
              swipe(el,cb){let s=null;
                el.addEventListener('pointerdown',e=>{s=[e.clientX,e.clientY]});
                el.addEventListener('pointerup',e=>{if(!s)return;const dx=e.clientX-s[0],dy=e.clientY-s[1];s=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))});
                const k=e=>{const m={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d'}[e.key];if(m)cb(m)};
                addEventListener('keydown',k);cleanups.push(()=>removeEventListener('keydown',k))},
              beep(f=440,d=.08){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;v.gain.value=.04;o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}},
              over(score){
                if(done)return;done=true;stop();
                const earn=score>0?Math.min(60,Math.max(1,Math.round(score*(g.k||1)))):0;
                S.coins+=earn;const nb=score>(S.best[g.id]||0);if(nb)S.best[g.id]=score;save();upd();
                const o=h('div','ovl',`<div class="box"><h2>Oyun bitdi</h2><p>Xal: <b>${score}</b>${nb&&score>0?' 🏆 Yeni rekord!':''}</p><div class="earn">+${earn} 🪙</div></div>`);
                const b1=h('button','btn','Yenidən oyna');b1.onclick=()=>play(g);
                const b2=h('button','btn alt','Menyu');b2.onclick=home;
                o.firstChild.append(b1,b2);app.append(o);
              }
            };
            g.start(root,api);
          }

          AZ.init=()=>{
            const d=new Date().toISOString().slice(0,10);let b=0;
            if(S.day!==d){S.day=d;S.coins+=20;save();b=1}
            home();if(b)toast('Gündəlik bonus: +20 🪙');
            document.addEventListener('contextmenu',e=>e.preventDefault());
            try{const A=window.Capacitor.Plugins.App;A.addListener('backButton',()=>{cur?home():A.exitApp()})}catch(e){}
          };
          })();
          AZEOF
          mkdir -p www/games
          cat > www/games/zeka.js <<'AZEOF'
          (()=>{
          const{h,rnd,pick,shuffle}=AZ;

          // 1. Xalça Puzzle (3-lü uyğunlaşdırma)
          AZ.reg({id:'xalca',name:'Xalça Puzzle',cat:'zeka',icon:'🧶',k:.12,start(root,api){
           const N=6,T=['🔴','🟠','🟡','🟢','🔵','🟣'];let g=[],sel=null,moves=20,score=0,busy=false;
           const info=AZ.info(root,''),bd=AZ.board(root,N),cells=[],r6=()=>rnd(0,5);
           const find=()=>{const m=new Set();for(let r=0;r<N;r++)for(let c=0;c<N;c++){const i=r*N+c,v=g[i];if(v<0)continue;
            if(c<N-2&&g[i+1]===v&&g[i+2]===v){m.add(i);m.add(i+1);m.add(i+2)}
            if(r<N-2&&g[i+N]===v&&g[i+2*N]===v){m.add(i);m.add(i+N);m.add(i+2*N)}}return m};
           do{g=Array.from({length:N*N},r6)}while(find().size);
           const draw=()=>{g.forEach((v,i)=>{cells[i].textContent=v<0?'':T[v];cells[i].classList.toggle('sel',i===sel)});info.textContent=`Gediş: ${moves} · Xal: ${score}`;api.score(score)};
           const fall=()=>{for(let c=0;c<N;c++){const col=[];for(let r=N-1;r>=0;r--)if(g[r*N+c]>=0)col.push(g[r*N+c]);for(let r=N-1;r>=0;r--)g[r*N+c]=col.length?col.shift():r6()}};
           const resolve=()=>{const m=find();
            if(!m.size){busy=false;draw();if(moves<=0)api.after(500,()=>api.over(score));return}
            score+=m.size*5;m.forEach(i=>g[i]=-1);draw();api.beep(600,.06);
            api.after(250,()=>{fall();draw();api.after(250,resolve)})};
           const tap=i=>{if(busy||moves<=0)return;if(sel===null){sel=i;draw();return}
            const a=sel;sel=null;const d=Math.abs(a-i);
            if(!(d===N||(d===1&&Math.floor(a/N)===Math.floor(i/N)))){sel=i;draw();return}
            [g[a],g[i]]=[g[i],g[a]];
            if(!find().size){[g[a],g[i]]=[g[i],g[a]];draw();return}
            moves--;busy=true;resolve()};
           for(let i=0;i<N*N;i++){const b=h('button','cell');b.onclick=()=>tap(i);bd.append(b);cells.push(b)}
           draw()}});

          // 2. Paxlava Puzzle (2048 üslubunda)
          AZ.reg({id:'paxlava',name:'Paxlava Puzzle',cat:'zeka',icon:'🍯',k:.02,start(root,api){
           const N=4;let g=Array(16).fill(0),score=0;const info=AZ.info(root,''),bd=AZ.board(root,N),cells=[];
           for(let i=0;i<16;i++){const b=h('div','cell t');bd.append(b);cells.push(b)}
           const add=()=>{const e=g.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length)g[pick(e)]=Math.random()<.9?2:4};
           const draw=()=>{g.forEach((v,i)=>{cells[i].textContent=v||'';cells[i].style.background=v?`hsl(${45+Math.log2(v)*22},85%,${72-Math.log2(v)*3}%)`:''});info.textContent='Sürüşdür! Xal: '+score;api.score(score)};
           const line=a=>{const r=a.filter(v=>v);for(let i=0;i<r.length-1;i++)if(r[i]===r[i+1]){r[i]*=2;score+=r[i];r.splice(i+1,1)}while(r.length<N)r.push(0);return r};
           const can=()=>g.includes(0)||g.some((v,i)=>(i%N<N-1&&g[i+1]===v)||(i<N*(N-1)&&g[i+N]===v));
           const move=d=>{const o=g.join();for(let k=0;k<N;k++){const idx=[];for(let j=0;j<N;j++)idx.push(d==='l'?k*N+j:d==='r'?k*N+N-1-j:d==='u'?j*N+k:(N-1-j)*N+k);const r=line(idx.map(i=>g[i]));idx.forEach((i,j)=>g[i]=r[j])}
            if(g.join()!==o){add();draw();api.beep(400,.04);if(!can())api.after(600,()=>api.over(score))}};
           add();add();draw();api.swipe(root,move)}});

          // 3. Yaddaş Kartları
          AZ.reg({id:'yaddas',name:'Yaddaş Kartları',cat:'zeka',icon:'🃏',k:.4,start(root,api){
           const E=['🍯','🍵','🏔️','🐎','🐍','🎱','🧶','🍇'];const c=shuffle([...E,...E]);let open=[],found=0,moves=0,lock=false;
           const info=AZ.info(root,'Gediş: 0'),bd=AZ.board(root,4),b=[];
           c.forEach((v,i)=>{const e=h('button','cell','❓');
            e.onclick=()=>{if(lock||open.includes(i)||e.classList.contains('ok'))return;
             e.textContent=v;e.classList.add('sel');open.push(i);api.beep(500,.04);
             if(open.length===2){moves++;info.textContent='Gediş: '+moves;const[x,y]=open;
              if(c[x]===c[y]){b[x].classList.add('ok');b[y].classList.add('ok');open=[];if(++found===8)api.after(500,()=>api.over(Math.max(10,100-moves*4)))}
              else{lock=true;api.after(700,()=>{[x,y].forEach(j=>{b[j].textContent='❓';b[j].classList.remove('sel')});open=[];lock=false})}}};
            bd.append(e);b.push(e)})}});

          // 4. Beşdaş (5 daş düz, kompüterə qarşı)
          AZ.reg({id:'besdas',name:'Beşdaş',cat:'zeka',icon:'⚫',k:.4,start(root,api){
           const N=9;let g=Array(N*N).fill(0),end=false,lk=false;const info=AZ.info(root,'Sən ⚫ · 5 daşı düz düz!'),bd=AZ.board(root,N),cs=[];
           const D=[[1,0],[0,1],[1,1],[1,-1]];
           const cnt=(i,p,d)=>{const r=i/N|0,c=i%N;let n=1,o=0;for(const s of[1,-1]){let y=r+d[1]*s,x=c+d[0]*s;while(y>=0&&y<N&&x>=0&&x<N&&g[y*N+x]===p){n++;y+=d[1]*s;x+=d[0]*s}if(y>=0&&y<N&&x>=0&&x<N&&g[y*N+x]===0)o++}return[n,o]};
           const win=(i,p)=>D.some(d=>cnt(i,p,d)[0]>=5);
           const val=(i,p)=>D.reduce((s,d)=>{const[n,o]=cnt(i,p,d);return s+(n>=5?1e5:n===4?[0,1e3,5e3][o]:n===3?[0,20,200][o]:n===2?[0,3,6][o]:0)},0);
           const draw=()=>g.forEach((v,i)=>cs[i].textContent=v===1?'⚫':v===2?'⚪':'');
           const ai=()=>{let best=-1,bi=-1;g.forEach((v,i)=>{if(v)return;const s=val(i,2)*1.1+val(i,1)+Math.random()*3;if(s>best){best=s;bi=i}});
            if(bi<0){end=true;return api.over(20)}
            g[bi]=2;draw();if(win(bi,2)){end=true;api.after(400,()=>api.over(0))}};
           for(let i=0;i<N*N;i++){const b=h('button','cell go');
            b.onclick=()=>{if(end||lk||g[i])return;lk=true;g[i]=1;draw();api.beep(500,.04);
             if(win(i,1)){end=true;return api.after(300,()=>api.over(50))}
             api.after(250,()=>{ai();lk=false})};
            bd.append(b);cs.push(b)}}});

          // 5. İşıqlar
          AZ.reg({id:'isiqlar',name:'İşıqlar',cat:'zeka',icon:'💡',k:4,start(root,api){
           const N=5;let g,lv=0,mv=0;const info=AZ.info(root,''),bd=AZ.board(root,N),cs=[];
           const press=i=>{const r=i/N|0,c=i%N;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const y=r+a,x=c+b;if(y>=0&&y<N&&x>=0&&x<N)g[y*N+x]^=1})};
           const draw=()=>{g.forEach((v,i)=>cs[i].classList.toggle('on',!!v));info.textContent=`Səviyyə ${lv+1}/5 · Gediş ${mv} · Hamısını söndür!`;api.score(lv)};
           const nw=()=>{g=Array(25).fill(0);mv=0;for(let k=0;k<3+lv;k++)press(rnd(0,24));if(!g.some(v=>v))press(12);draw()};
           for(let i=0;i<25;i++){const b=h('button','cell lamp');
